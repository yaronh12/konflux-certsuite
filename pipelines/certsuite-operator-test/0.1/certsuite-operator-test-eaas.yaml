apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: certsuite-operator-test-eaas
  labels:
    app.kubernetes.io/part-of: konflux-certsuite
    upstream-usable: "true"
spec:
  description: |
    Provisions an ephemeral EaaS Hypershift cluster, deploys an operator from
    an FBC fragment, deploys operands from a test bundle, and runs certsuite.
    The cluster is automatically destroyed when the PipelineRun completes.

    This is the recommended variant for most operators. Use the shared-cluster
    variant (certsuite-operator-test.yaml) only when you need a persistent
    cluster with specific hardware or configuration.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux ApplicationSnapshot JSON
    - name: TEST_BUNDLE_REF
      type: string
      description: |
        Git URL pointing to the operator's certsuite test bundle.
        Format: URL[.git@revision][#path]
        Examples:
          https://github.com/org/repo.git@main#tests/my-bundle
          https://github.com/org/repo#tests/my-bundle
          https://github.com/org/repo.git@fix/my-branch#tests/my-bundle
    - name: CERTSUITE_LABELS
      type: string
      default: "common"
      description: |
        Comma-separated certsuite test labels (e.g. "networking,lifecycle").
    - name: PACKAGE_NAME
      type: string
      default: ""
    - name: CHANNEL_NAME
      type: string
      default: ""
    - name: IMAGES_MIRROR_SET_REF
      type: string
      default: ""
      description: |
        Optional override for the operator's ImageDigestMirrorSet used to build
        Hypershift imageContentSources (managed IDMS on the guest cluster).

        Format: URL[.git@revision][#path]
        Example:
          https://github.com/org/repo.git@release-4.22#.tekton/images-mirror-set.yaml

        When empty (recommended), the pipeline uses the same git repo/revision as
        TEST_BUNDLE_REF with path .tekton/images-mirror-set.yaml — the Konflux
        / Conforma convention most operator monorepos already maintain.

        Leave unset for released operators that pull from registry.redhat.io
        (or when the FBC is not on quay.io/redhat-user-workloads).
    - name: OCI_PUSH_SECRET
      type: string
      default: "imagerepository-ptp-operator-fbc-4-22-image-push"
      description: |
        kubernetes.io/dockerconfigjson Secret with push access to the Quay repo
        where certsuite results are stored. Use the component's ImageRepository
        push secret (oc get imagerepository -o jsonpath='{.status.credentials.push-secret}').
        Results are tagged on the same image URL as the FBC/component under test.

  tasks:
    # ── 1. Parse Snapshot Metadata ──────────────────────────────────────
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    # ── 2. Provision EaaS Space ────────────────────────────────────────
    - name: provision-eaas-space
      runAfter:
        - parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    # ── 3. Get Unreleased Bundle from FBC ──────────────────────────────
    - name: get-unreleased-bundle
      runAfter:
        - provision-eaas-space
      taskSpec:
        results:
          - name: unreleasedBundle
            value: "$(steps.get-bundle.results.unreleasedBundle)"
          - name: quayBundle
            value: "$(steps.resolve-quay-bundle.results.quayBundle)"
          - name: packageName
            value: "$(steps.get-bundle.results.packageName)"
          - name: channelName
            value: "$(steps.get-bundle.results.channelName)"
        steps:
          - name: get-bundle
            computeResources:
              limits:
                memory: 8Gi
              requests:
                memory: 8Gi
                cpu: "1"
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/get-unreleased-bundle/0.1/get-unreleased-bundle.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: packageName
                value: $(params.PACKAGE_NAME)
              - name: channelName
                value: $(params.CHANNEL_NAME)

          # Catalog refs point at registry.redhat.io (401 for unreleased images).
          # Resolve the same digest on quay.io before any step tries opm render.
          - name: resolve-quay-bundle
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            env:
              - name: FBC_FRAGMENT
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: BUNDLE_IMAGE
                value: "$(steps.get-bundle.results.unreleasedBundle)"
            results:
              - name: quayBundle
                type: string
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              RESULT="$(results.quayBundle.path)"

              if [[ -z "${BUNDLE_IMAGE}" ]]; then
                echo -n "" > "${RESULT}"
                exit 0
              fi

              # Already a quay ref (or non-Konflux) — pass through
              if [[ "${BUNDLE_IMAGE}" == quay.io/* ]]; then
                echo "[$$(date -u +%FT%T.%3NZ)] Bundle already on quay: ${BUNDLE_IMAGE}"
                echo -n "${BUNDLE_IMAGE}" > "${RESULT}"
                exit 0
              fi

              if [[ "${FBC_FRAGMENT}" != quay.io/redhat-user-workloads/* ]]; then
                echo "[$$(date -u +%FT%T.%3NZ)] FBC not on redhat-user-workloads; keeping catalog ref"
                echo -n "${BUNDLE_IMAGE}" > "${RESULT}"
                exit 0
              fi

              FBC_BASE="${FBC_FRAGMENT%%@*}"
              TENANT_AND_REPO="${FBC_BASE#quay.io/redhat-user-workloads/}"
              TENANT="${TENANT_AND_REPO%%/*}"
              FBC_REPO="${TENANT_AND_REPO#*/}"
              BUNDLE_DIGEST="${BUNDLE_IMAGE##*@}"

              BUNDLE_REPO=$$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-mono-/')
              QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"
              echo "[$$(date -u +%FT%T.%3NZ)] Trying ${QUAY_BUNDLE}"
              if ! skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null; then
                BUNDLE_REPO=$$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-/')
                QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"
                echo "[$$(date -u +%FT%T.%3NZ)] Trying fallback ${QUAY_BUNDLE}"
                skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null || \
                  { echo "ERROR: Cannot resolve quay bundle for digest ${BUNDLE_DIGEST}" >&2; exit 1; }
              fi

              echo "[$$(date -u +%FT%T.%3NZ)] Resolved quay bundle: ${QUAY_BUNDLE}"
              echo -n "${QUAY_BUNDLE}" > "${RESULT}"

    # ── 4. Pick Cluster Params ─────────────────────────────────────────
    - name: pick-cluster-params
      runAfter:
        - get-unreleased-bundle
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: ocpVersion
            value: "$(steps.pick-cluster-version.results.ocpVersion)"
          - name: bundleArch
            value: "$(steps.pick-cluster-arch.results.bundleArch)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: "$(tasks.provision-eaas-space.results.secretRef)"
          - name: pick-cluster-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-version/0.1/pick-cluster-version.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: clusterVersions
                value: ["$(steps.get-supported-versions.results.versions[*])"]
          - name: pick-cluster-arch
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-arch/0.1/pick-cluster-arch.yaml
            params:
              # Must be a pullable operator bundle (quay.io for unreleased).
              # Catalog refs on registry.redhat.io return 401 for pre-release digests.
              - name: bundleImage
                value: "$(tasks.get-unreleased-bundle.results.quayBundle)"

    # ── 5. Build Hypershift imageContentSources ────────────────────────
    # Fetch the operator's ImageDigestMirrorSet (Conforma convention), convert
    # to Hypershift imageContentSources, pass as a string into create-cluster.
    - name: build-image-content-sources
      runAfter:
        - pick-cluster-params
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: imagesMirrorSetRef
          value: $(params.IMAGES_MIRROR_SET_REF)
      taskSpec:
        params:
          - name: fbcFragment
            type: string
          - name: testBundleRef
            type: string
          - name: imagesMirrorSetRef
            type: string
        results:
          - name: imageContentSources
            description: Hypershift imageContentSources YAML (empty if none)
        steps:
          - name: build
            image: quay.io/konflux-ci/task-runner:1.5.0@sha256:200019314a50be5b6dd06f362c794c92a700583a522c5eee9a41e3eab7f706c5
            env:
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
              - name: IMAGES_MIRROR_SET_REF
                value: "$(params.imagesMirrorSetRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Use $$(...) so Tekton does not treat bash substitutions as variables.
              ICS_OUT="/tmp/image-content-sources.yaml"
              : > "${ICS_OUT}"
              RESULT="$(results.imageContentSources.path)"

              finish() {
                cat "${ICS_OUT}" > "${RESULT}"
              }
              trap finish EXIT

              # Released / non-Konflux FBC: nothing to mirror
              if [[ "${FBC_FRAGMENT}" != quay.io/redhat-user-workloads/* ]]; then
                echo "[$$(date -u +%FT%T.%3NZ)] FBC is not on redhat-user-workloads; skipping imageContentSources"
                exit 0
              fi

              # Resolve mirror-set ref: explicit override, else same repo as TEST_BUNDLE_REF
              MIRROR_REF="${IMAGES_MIRROR_SET_REF}"
              if [[ -z "${MIRROR_REF}" ]]; then
                FULL_URL="${TEST_BUNDLE_REF%%#*}"
                if [[ "${FULL_URL}" == *".git@"* ]]; then
                  GIT_URL="${FULL_URL%@*}"
                  GIT_REF="${FULL_URL##*.git@}"
                elif [[ "${FULL_URL}" =~ ^(https://[^@]+)@([^@]+)$ ]]; then
                  GIT_URL="${BASH_REMATCH[1]}"
                  GIT_REF="${BASH_REMATCH[2]}"
                else
                  GIT_URL="${FULL_URL}"
                  GIT_REF="main"
                fi
                MIRROR_REF="${GIT_URL%.git}.git@${GIT_REF}#.tekton/images-mirror-set.yaml"
                echo "[$$(date -u +%FT%T.%3NZ)] Defaulting IMAGES_MIRROR_SET_REF from TEST_BUNDLE_REF"
              fi

              FULL_URL="${MIRROR_REF%%#*}"
              FILE_PATH="${MIRROR_REF#*#}"
              [[ "${FILE_PATH}" == "${MIRROR_REF}" ]] && FILE_PATH=".tekton/images-mirror-set.yaml"

              if [[ "${FULL_URL}" == *".git@"* ]]; then
                GIT_URL="${FULL_URL%@*}"
                GIT_REF="${FULL_URL##*.git@}"
              elif [[ "${FULL_URL}" =~ ^(https://[^@]+)@([^@]+)$ ]]; then
                GIT_URL="${BASH_REMATCH[1]}"
                GIT_REF="${BASH_REMATCH[2]}"
              else
                GIT_URL="${FULL_URL}"
                GIT_REF="main"
              fi
              GIT_URL="${GIT_URL%.git}"

              echo "[$$(date -u +%FT%T.%3NZ)] Fetching mirror set: ${GIT_URL}@${GIT_REF} path=${FILE_PATH}"

              IDMS_FILE="/tmp/images-mirror-set.yaml"
              if [[ "${GIT_URL}" =~ github.com/([^/]+)/([^/]+) ]]; then
                ORG="${BASH_REMATCH[1]}"
                REPO="${BASH_REMATCH[2]}"
                RAW_URL="https://raw.githubusercontent.com/${ORG}/${REPO}/${GIT_REF}/${FILE_PATH}"
                if ! curl -fsSL "${RAW_URL}" -o "${IDMS_FILE}"; then
                  echo "ERROR: Failed to fetch ${RAW_URL}" >&2
                  echo "Unreleased operators need .tekton/images-mirror-set.yaml in the monorepo" >&2
                  echo "(same file used by Conforma). Or set IMAGES_MIRROR_SET_REF explicitly." >&2
                  exit 1
                fi
              else
                CLONE_DIR=$$(mktemp -d)
                curl -fsSL "${GIT_URL}/archive/${GIT_REF}.tar.gz" | tar xz -C "${CLONE_DIR}" --strip-components=1
                if [[ ! -f "${CLONE_DIR}/${FILE_PATH}" ]]; then
                  echo "ERROR: ${FILE_PATH} not found in ${GIT_URL}@${GIT_REF}" >&2
                  exit 1
                fi
                cp "${CLONE_DIR}/${FILE_PATH}" "${IDMS_FILE}"
                rm -rf "${CLONE_DIR}"
              fi

              KIND=$$(yq -r 'select(.kind != null) | .kind' "${IDMS_FILE}" | head -1)
              if [[ "${KIND}" == "ImageDigestMirrorSet" ]]; then
                yq -o=yaml 'select(.kind == "ImageDigestMirrorSet") | .spec.imageDigestMirrors' \
                  "${IDMS_FILE}" > "${ICS_OUT}"
              elif yq -e '.[0].source' "${IDMS_FILE}" &>/dev/null; then
                cp "${IDMS_FILE}" "${ICS_OUT}"
              else
                echo "ERROR: ${FILE_PATH} is neither ImageDigestMirrorSet nor an imageContentSources list" >&2
                cat "${IDMS_FILE}" >&2
                exit 1
              fi

              if [[ ! -s "${ICS_OUT}" ]] || [[ "$$(yq 'length' "${ICS_OUT}")" == "0" ]]; then
                echo "ERROR: No mirrors found in ${FILE_PATH}" >&2
                exit 1
              fi

              echo "[$$(date -u +%FT%T.%3NZ)] Built imageContentSources:"
              cat "${ICS_OUT}"

    # ── 6. Provision Ephemeral Cluster ─────────────────────────────────
    # Note: do not gate on ocpVersion/bundleArch results. Those StepAction
    # results sometimes do not surface on the TaskRun, which makes Tekton
    # treat them as "" and silently skip this task (PipelineRun still Succeeded).
    - name: provision-cluster
      runAfter:
        - build-image-content-sources
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: imageContentSources
          value: "$(tasks.build-image-content-sources.results.imageContentSources)"
      taskSpec:
        params:
          - name: imageContentSources
            type: string
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-latest-version-tag
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(tasks.pick-cluster-params.results.ocpVersion)"

          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.get-latest-version-tag.results.version)"
              - name: instanceType
                value: "$(tasks.pick-cluster-params.results.bundleArch)"
              - name: imageContentSources
                value: "$(params.imageContentSources)"

    # ── 7. Deploy Operator + Operands + Run Certsuite ──────────────────
    - name: deploy-and-test
      runAfter:
        - provision-cluster
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: eaasSpaceSecretRef
          value: $(tasks.provision-eaas-space.results.secretRef)
        - name: clusterName
          value: "$(tasks.provision-cluster.results.clusterName)"
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: bundleImage
          value: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
        - name: packageName
          value: "$(tasks.get-unreleased-bundle.results.packageName)"
        - name: channelName
          value: "$(tasks.get-unreleased-bundle.results.channelName)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: certsuiteLabels
          value: $(params.CERTSUITE_LABELS)
        - name: ociPushSecret
          value: $(params.OCI_PUSH_SECRET)
      taskSpec:
        params:
          - name: eaasSpaceSecretRef
            type: string
          - name: clusterName
            type: string
          - name: fbcFragment
            type: string
          - name: bundleImage
            type: string
          - name: packageName
            type: string
          - name: channelName
            type: string
          - name: testBundleRef
            type: string
          - name: certsuiteLabels
            type: string
          - name: ociPushSecret
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: oci-push-creds
            secret:
              secretName: $(params.ociPushSecret)
              optional: true
        steps:
          # ── Step 1: Get kubeconfig from EaaS ─────────────────────────
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(params.eaasSpaceSecretRef)
              - name: clusterName
                value: $(params.clusterName)
              - name: credentials
                value: credentials

          # ── Step 2: Deploy operator via OLM ──────────────────────────
          - name: deploy-operator
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 4Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: BUNDLE_IMAGE
                value: "$(params.bundleImage)"
              - name: PACKAGE_NAME
                value: "$(params.packageName)"
              - name: CHANNEL_NAME
                value: "$(params.channelName)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operator: package=${PACKAGE_NAME} channel=${CHANNEL_NAME}"
              oc whoami || { echo "ERROR: Cannot connect to cluster"; exit 1; }

              # ── Wait for at least one worker node to be Ready ──────────────
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for worker nodes..."
              for i in $(seq 1 90); do
                READY_NODES=$(oc get nodes --no-headers 2>/dev/null | grep -c ' Ready' || echo "0")
                if [[ "${READY_NODES}" -gt 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] ${READY_NODES} node(s) Ready"
                  break
                fi
                [[ ${i} -eq 90 ]] && { echo "ERROR: No nodes became Ready within 450s"; exit 1; }
                sleep 5
              done

              # ── Verify Hypershift-managed IDMS (from imageContentSources) ───
              echo "[$(date -u +%FT%T.%3NZ)] Checking ImageDigestMirrorSet on guest cluster..."
              for i in $(seq 1 30); do
                IDMS_COUNT=$(oc get imagedigestmirrorset -o name 2>/dev/null | wc -l | tr -d ' ')
                if [[ "${IDMS_COUNT}" -gt 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] Found ${IDMS_COUNT} ImageDigestMirrorSet(s):"
                  oc get imagedigestmirrorset -o yaml | jq -r '
                    .items[]? |
                    "  \(.metadata.name): " +
                    ([.spec.imageDigestMirrors[]? | "\(.source) -> \(.mirrors[0])"] | join("; "))
                  ' 2>/dev/null || oc get imagedigestmirrorset
                  break
                fi
                if [[ ${i} -eq 30 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] WARNING: No IDMS found. Unreleased registry.redhat.io pulls may fail."
                  echo "  Ensure .tekton/images-mirror-set.yaml exists (or IMAGES_MIRROR_SET_REF) and ClusterTemplate supports imageContentSources."
                fi
                sleep 5
              done

              # ── Render FBC for package/bundle metadata (no image patching) ──
              echo "[$(date -u +%FT%T.%3NZ)] Rendering FBC fragment..."
              opm render "${FBC_FRAGMENT}" > /tmp/fbc.json

              BUNDLE_NAME=$(jq -r 'select(.schema == "olm.bundle") | .name' /tmp/fbc.json | head -1)
              echo "[$(date -u +%FT%T.%3NZ)] Bundle name: ${BUNDLE_NAME}"
              echo "[$(date -u +%FT%T.%3NZ)] Bundle image (via IDMS): $(jq -r 'select(.schema == "olm.bundle") | .image' /tmp/fbc.json | head -1)"
              echo "[$(date -u +%FT%T.%3NZ)] Unreleased bundle result: ${BUNDLE_IMAGE}"

              # ── Determine install namespace from FBC metadata ────────────────
              INSTALL_NAMESPACE=$(jq -r 'select(.schema == "olm.bundle") | .properties[]? |
                select(.type == "olm.csv.metadata") | .value.annotations["operatorframework.io/suggested-namespace"] // empty' \
                /tmp/fbc.json 2>/dev/null | grep -v '^$' | head -1)

              if [[ -z "${INSTALL_NAMESPACE}" || "${INSTALL_NAMESPACE}" == "null" ]]; then
                INSTALL_NAMESPACE=$(oc create -f - -o jsonpath='{.metadata.name}' <<NS_EOF
              apiVersion: v1
              kind: Namespace
              metadata:
                generateName: oo-
              NS_EOF
                )
              elif ! oc get namespace "${INSTALL_NAMESPACE}" &>/dev/null; then
                oc create namespace "${INSTALL_NAMESPACE}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Namespace: ${INSTALL_NAMESPACE}"
              echo -n "${INSTALL_NAMESPACE}" > /workspace/install-namespace

              # ── OperatorGroup (OwnNamespace) ─────────────────────────────────
              EXISTING_OG=$(oc -n "${INSTALL_NAMESPACE}" get operatorgroup -o jsonpath="{.items[*].metadata.name}" 2>/dev/null || true)
              if [[ -z "${EXISTING_OG}" ]]; then
                oc create -f - <<OG_EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                targetNamespaces:
                  - ${INSTALL_NAMESPACE}
              OG_EOF
              fi

              # ── CatalogSource from FBC fragment image (quay.io) ───────────────
              # Bundle/operator images still reference registry.redhat.io in the
              # catalog/CSV; Hypershift IDMS (from imageContentSources) redirects
              # those pulls to quay.io transparently.
              CATSRC=$(oc create -f - -o jsonpath='{.metadata.name}' <<CS_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                sourceType: grpc
                image: ${FBC_FRAGMENT}
                displayName: "Certsuite Test Catalog"
                publisher: "konflux-certsuite"
              CS_EOF
              )

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CatalogSource ${CATSRC}..."
              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                [[ "${STATE}" == "READY" ]] && break
                [[ ${i} -eq 60 ]] && {
                  echo "ERROR: CatalogSource not ready" >&2
                  oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                  oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
                  exit 1
                }
                sleep 10
              done
              echo "[$(date -u +%FT%T.%3NZ)] CatalogSource ${CATSRC} READY"

              # ── Subscription (Manual so we can patch Hypershift CSV constraints)
              SUB=$(oc create -f - -o jsonpath='{.metadata.name}' <<SUB_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                channel: ${CHANNEL_NAME}
                installPlanApproval: Manual
                name: ${PACKAGE_NAME}
                source: ${CATSRC}
                sourceNamespace: ${INSTALL_NAMESPACE}
                startingCSV: ${BUNDLE_NAME}
              SUB_EOF
              )

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for InstallPlan..."
              IP=""
              for i in $(seq 1 60); do
                IP=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null || echo "")
                [[ -n "${IP}" ]] && break
                sleep 5
              done
              if [[ -z "${IP}" ]]; then
                echo "ERROR: No InstallPlan created" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] Approving InstallPlan ${IP}..."
              oc patch installplan "${IP}" -n "${INSTALL_NAMESPACE}" \
                --type merge -p '{"spec":{"approved":true}}' 2>&1

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for OLM to create CSV..."
              CSV=""
              for i in $(seq 1 60); do
                CSV=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                [[ -n "${CSV}" ]] && break
                # installedCSV may lag; the CSV often appears as startingCSV first
                if oc get csv "${BUNDLE_NAME}" -n "${INSTALL_NAMESPACE}" &>/dev/null; then
                  CSV="${BUNDLE_NAME}"
                  break
                fi
                sleep 5
              done
              if [[ -z "${CSV}" ]]; then
                echo "ERROR: OLM did not create CSV" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                oc get installplan "${IP}" -n "${INSTALL_NAMESPACE}" -o yaml >&2 || true
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] CSV created: ${CSV}"

              # Hypershift-only CSV fixes (not image-related — IDMS handles pulls)
              echo "[$(date -u +%FT%T.%3NZ)] Patching CSV for Hypershift constraints..."
              CSV_JSON=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o json)
              CSV_JSON=$(echo "${CSV_JSON}" | jq 'del(.spec.minKubeVersion)')
              CSV_JSON=$(echo "${CSV_JSON}" | jq '
                (.spec.install.spec.deployments[]?.spec.template.spec.nodeSelector) |=
                  (if . then del(.["node-role.kubernetes.io/master"]) else . end)')
              echo "${CSV_JSON}" | oc replace -f - 2>&1

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CSV phase=Succeeded..."
              for i in $(seq 1 120); do
                PHASE=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [[ "${PHASE}" == "Succeeded" ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] CSV '${CSV}' ready"

                  oc patch subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                    --type merge --subresource status \
                    -p "{\"status\":{\"installedCSV\":\"${CSV}\"}}" 2>&1 || true

                  oc label csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                    "redhat-best-practices-for-k8s.com/operator=target" --overwrite 2>&1

                  DS_NAMES=$(oc get daemonsets -n "${INSTALL_NAMESPACE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
                  for DS in ${DS_NAMES}; do
                    echo "[$(date -u +%FT%T.%3NZ)] Patching DaemonSet ${DS} with certsuite labels..."
                    oc patch daemonset "${DS}" -n "${INSTALL_NAMESPACE}" --type=merge \
                      -p '{"spec":{"template":{"metadata":{"labels":{"redhat-best-practices-for-k8s.com/generic":"target"}}}}}' 2>&1
                    oc rollout status daemonset/"${DS}" -n "${INSTALL_NAMESPACE}" --timeout=120s 2>&1 || true
                  done

                  exit 0
                elif [[ "${PHASE}" == "Failed" ]]; then
                  echo "ERROR: CSV failed" >&2
                  oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o jsonpath='{.status.message}' >&2
                  oc get events -n "${INSTALL_NAMESPACE}" --sort-by='.lastTimestamp' | tail -30 >&2 || true
                  exit 1
                fi
                sleep 10
              done

              echo "ERROR: Timed out waiting for CSV (phase=${PHASE})" >&2
              oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o yaml >&2 || true
              oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
              oc get events -n "${INSTALL_NAMESPACE}" --sort-by='.lastTimestamp' | tail -40 >&2 || true
              exit 1

          # ── Step 3: Deploy operands from test bundle ─────────────────
          - name: deploy-operands
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              INSTALL_NAMESPACE=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NAMESPACE=$(cat /workspace/install-namespace)

              # Fetch test bundle via curl (no git dependency)
              BUNDLE_DIR="/workspace/test-bundle"
              mkdir -p "${BUNDLE_DIR}"

              FULL_URL="${TEST_BUNDLE_REF%%#*}"
              BUNDLE_PATH="${TEST_BUNDLE_REF#*#}"
              [[ "${BUNDLE_PATH}" == "${TEST_BUNDLE_REF}" ]] && BUNDLE_PATH="."

              if [[ "${FULL_URL}" == *".git@"* ]]; then
                GIT_URL="${FULL_URL%@*}"
                GIT_REF="${FULL_URL##*.git@}"
              elif [[ "${FULL_URL}" =~ ^(https://[^@]+)@([^@]+)$ ]]; then
                GIT_URL="${BASH_REMATCH[1]}"
                GIT_REF="${BASH_REMATCH[2]}"
              else
                GIT_URL="${FULL_URL}"
                GIT_REF="main"
              fi
              GIT_URL="${GIT_URL%.git}"

              echo "[$(date -u +%FT%T.%3NZ)] Downloading ${GIT_URL} ref=${GIT_REF} (path: ${BUNDLE_PATH})"
              CLONE_DIR=$(mktemp -d)
              curl -sL "${GIT_URL}/archive/${GIT_REF}.tar.gz" | tar xz -C "${CLONE_DIR}" --strip-components=1
              cp -r "${CLONE_DIR}/${BUNDLE_PATH}/." "${BUNDLE_DIR}/"
              rm -rf "${CLONE_DIR}"

              if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
                echo "ERROR: certsuite-test-bundle.yaml not found" >&2
                exit 1
              fi

              # Determine target namespace
              TARGET_NS=$(grep -A1 'namespace:' "${BUNDLE_DIR}/certsuite-test-bundle.yaml" | tail -1 | awk '{print $NF}' || echo "")
              TARGET_NS="${TARGET_NS:-${INSTALL_NAMESPACE}}"

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operands to: ${TARGET_NS}"

              if [[ -n "${TARGET_NS}" && "${TARGET_NS}" != "${INSTALL_NAMESPACE}" ]]; then
                oc create namespace "${TARGET_NS}" 2>/dev/null || true
              fi

              # Apply prerequisites
              if [[ -d "${BUNDLE_DIR}/prerequisites" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/prerequisites/" 2>/dev/null || true
              fi

              # Apply operands
              if [[ -d "${BUNDLE_DIR}/operands" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/operands/"
              fi

              # Wait for deployments
              DEPS=$(oc get deployments -n "${TARGET_NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
              for DEP in ${DEPS}; do
                echo "  Waiting for deployment/${DEP}..."
                oc rollout status "deployment/${DEP}" -n "${TARGET_NS}" --timeout=300s || true
              done

              echo "[$(date -u +%FT%T.%3NZ)] Operand deployment complete"

          # ── Step 4: Run certsuite ────────────────────────────────────
          - name: run-certsuite
            image: quay.io/redhat-best-practices-for-k8s/certsuite:latest
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 2Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: CERTSUITE_LABELS
                value: "$(params.certsuiteLabels)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Disable in-cluster config so client-go uses the EaaS kubeconfig
              # instead of the Tekton pod's SA token
              unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT
              mkdir -p ~/.kube
              cp "${KUBECONFIG}" ~/.kube/config

              RESULTS_DIR="/workspace/results"
              CONFIG_FILE="/workspace/test-bundle/certsuite_config.yml"
              mkdir -p "${RESULTS_DIR}"

              if [[ ! -f "${CONFIG_FILE}" ]]; then
                echo "ERROR: certsuite_config.yml not found in test bundle" >&2
                exit 1
              fi

              mkdir -p config
              cp "${CONFIG_FILE}" config/certsuite_config.yml

              echo "[$(date -u +%FT%T.%3NZ)] KUBECONFIG=${KUBECONFIG}"

              IFS=',' read -ra LABELS <<< "${CERTSUITE_LABELS}"
              for LABEL in "${LABELS[@]}"; do
                LABEL=$(echo "${LABEL}" | xargs)
                SUITE_DIR="${RESULTS_DIR}/${LABEL}"
                mkdir -p "${SUITE_DIR}"

                echo "[$(date -u +%FT%T.%3NZ)] Running: ${LABEL}"
                set +e
                certsuite run \
                  --kubeconfig "${KUBECONFIG}" \
                  --config-file config/certsuite_config.yml \
                  --label-filter "${LABEL}" \
                  --output-dir "${SUITE_DIR}" \
                  2>&1 | tee "${SUITE_DIR}/certsuite.log"
                set -e
              done

              # Print summary
              for CLAIM in "${RESULTS_DIR}"/*/claim.json; do
                [[ -f "${CLAIM}" ]] || continue
                SUITE=$(basename "$(dirname "${CLAIM}")")
                TOTAL=$(jq '.claim.results | length' "${CLAIM}" 2>/dev/null || echo "?")
                PASSED=$(jq '[.claim.results[] | select(.state == "passed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                FAILED=$(jq '[.claim.results[] | select(.state == "failed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                echo "[$(date -u +%FT%T.%3NZ)] ${SUITE}: total=${TOTAL} passed=${PASSED} failed=${FAILED}"
              done

          # ── Step 5: Push results to the component's Quay repo ───────
          - name: push-results
            image: ghcr.io/oras-project/oras:v1.2.2
            onError: continue
            volumeMounts:
              - name: oci-push-creds
                mountPath: /oci-push-creds
                readOnly: true
            env:
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
            script: |
              #!/bin/sh
              set -eu

              RESULTS_DIR="/workspace/results"
              if [ ! -d "${RESULTS_DIR}" ] || ! ls "${RESULTS_DIR}"/*/claim.json >/dev/null 2>&1; then
                echo "No certsuite results found. Skipping OCI push."
                exit 0
              fi

              IMAGE_REF=$(echo "${FBC_FRAGMENT}" | cut -d'@' -f1)
              if [ -z "${IMAGE_REF}" ]; then
                echo "Cannot derive OCI ref from FBC_FRAGMENT. Skipping."
                exit 0
              fi

              # Use the component ImageRepository push secret (mounted volume)
              DOCKER_CFG="/oci-push-creds/.dockerconfigjson"
              if [ ! -f "${DOCKER_CFG}" ]; then
                echo "WARNING: OCI push secret not mounted at ${DOCKER_CFG}."
                echo "Set OCI_PUSH_SECRET to the component ImageRepository push secret."
                exit 0
              fi
              mkdir -p /tmp/docker
              cp "${DOCKER_CFG}" /tmp/docker/config.json
              export DOCKER_CONFIG=/tmp/docker

              OCI_TAG="certsuite-results-$(date -u +%Y%m%d-%H%M%S)"
              OCI_REF="${IMAGE_REF}:${OCI_TAG}"

              echo "Packaging results..."
              tar czf /tmp/certsuite-results.tar.gz -C /workspace results/

              echo "Pushing results to: ${OCI_REF}"
              cd /tmp
              if oras push "${OCI_REF}" \
                --artifact-type application/vnd.certsuite.results.v1+gzip \
                certsuite-results.tar.gz:application/gzip; then
                echo "Results pushed successfully"
                echo ""
                echo "Download results with:"
                echo "  oras pull ${OCI_REF}"
                echo "  tar xzf certsuite-results.tar.gz"
              else
                echo "WARNING: OCI push failed (non-fatal)"
              fi

    # Results are pushed to the same Quay repo as the FBC/component image,
    # tagged certsuite-results-<timestamp>. Auth via OCI_PUSH_SECRET
    # (ImageRepository push secret). Download with:
    #   oras pull <OCI_REF printed in push-results logs>
