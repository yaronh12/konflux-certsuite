# Example IntegrationTestScenario using the EaaS (ephemeral cluster) variant.
# This is the recommended approach -- no kubeconfig secrets, OADP, or
# cluster locks needed. Each run provisions a fresh Hypershift cluster.
#
# Copy this file into your Konflux tenants-config repository and update
# the values marked with <REPLACE>.
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "false"
  name: certsuite-operator-test
  namespace: <REPLACE:tenant-namespace>
spec:
  application: <REPLACE:application-name>
  contexts:
    - description: Certsuite testing for the FBC component
      name: component_<REPLACE:component-name>
  params:
    - name: TEST_BUNDLE_REF
      value: "https://github.com/<REPLACE:org>/<REPLACE:repo>.git#certsuite-test-bundle"
    # Required for unreleased operators (images only on quay.io, not registry.redhat.io).
    # Quay repo names under the same redhat-user-workloads tenant as the FBC.
    # The pipeline matches registry.redhat.io digests to these repos and passes
    # the result as Hypershift imageContentSources at cluster provision time.
    - name: COMPONENT_REPOS
      value: "<REPLACE:repo1>,<REPLACE:repo2>,<REPLACE:repo3>"
    # Example for PTP 4.22:
    #   ptp-operator-mono-4-22,linuxptp-daemon-mono-4-22,cloud-event-proxy-mono-4-22,ptp-must-gather-mono-4-22
    # Optional:
    # - CERTSUITE_LABELS: default "common"
    # - PACKAGE_NAME / CHANNEL_NAME: auto-detected from FBC when empty
    # - OCI_PUSH_SECRET: Quay push secret for certsuite results
  resolverRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/redhat-best-practices-for-k8s/konflux-certsuite.git
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/certsuite-operator-test/0.1/certsuite-operator-test-eaas.yaml
